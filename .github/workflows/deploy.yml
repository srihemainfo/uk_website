name: Deploy to Server

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          script: |
            # 1. Navigate to the directory where your website is hosted on the server
            #    (Change this to your actual server path)
            cd /var/www/uk_website
            
            # 2. Pull the latest changes from the master branch
            git pull origin master
            
            # 3. Optional: Run Laravel specific build commands (uncomment if needed)
            # composer install --no-interaction --prefer-dist --optimize-autoloader
            # php artisan migrate --force
            # php artisan optimize:clear
