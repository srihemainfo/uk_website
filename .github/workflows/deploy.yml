name: Deploy to Server

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          script: |
            cd /home/londonserver/uk.goride.run
            
            # Log all output to deploy.log
            exec > >(tee -a deploy.log) 2>&1
            echo "=== Deployment started at $(date) ==="
            
            # 1. Initialize git if it's not a repository yet
            if [ ! -d ".git" ]; then
                echo "Not a git repository. Initializing..."
                git init
                git remote add origin https://github.com/srihemainfo/uk_website.git
            fi
            
            # 2. Fetch and force reset to ensure the server perfectly matches GitHub
            echo "Pulling latest changes..."
            git fetch origin master
            git reset --hard origin/master
            
            # 3. Run Laravel specific build commands          
            echo "Clearing cache..."
            php artisan optimize:clear
            
            echo "=== Deployment finished successfully ==="
